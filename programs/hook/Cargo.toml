[package]
name = "hook"
version = "0.1.0"
description = "Hookasino limited token transfer hook (Any DEX, fomo-safe)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hook"

[features]
default = []
# Local testing only: mock pools (<240B layouts skip DBC checks) + init_mock_pool.
# Unit/integration tests run with --features local-test. MAINNET builds must
# NEVER enable it: without this feature every pool must be a full-size DBC pool.
local-test = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.2"
anchor-spl = "0.31.2" # keep: removing it breaks the build (global_allocator conflict with spl-token-2022)
spl-token-2022 = "6.0.0"
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"
spl-associated-token-account = "6.0.0" # keep: same reason (feature unification)
