[package]
name = "hook"
version = "0.1.0"
description = "Hookasino limited token transfer hook (Any DEX, fomo-safe)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.2"
anchor-spl = "0.31.2"
spl-token-2022 = "6.0.0"
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"
spl-associated-token-account = "6.0.0"
